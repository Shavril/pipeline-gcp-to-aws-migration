name: deploy-terraform

# Manual trigger only - this project has no server-side app to deploy (the
# pipeline runs locally), so the only thing "deployed" to AWS is the
# Terraform-managed infrastructure itself.
on:
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC -> AWS
  contents: read

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out tfplan

      - name: Terraform apply
        run: terraform apply tfplan

      # Redshift Serverless (no admin password set - see config.py) grants
      # superuser privileges to whichever IAM identity first provisions a
      # fresh namespace. When this workflow just created one, that's this
      # workflow's own role, not the local dev user that actually runs the
      # pipeline - which then has no privilege to CREATE SCHEMA, and
      # separately (a distinct system privilege, confirmed against AWS's
      # own GRANT reference) no privilege to CREATE USER either. System
      # privileges like CREATE USER can only be granted to a ROLE, not
      # directly to a user or PUBLIC, hence the extra CREATE ROLE +
      # GRANT ... TO ROLE + GRANT ROLE ... TO <user> sequence below.
      #
      # Every statement here is idempotent in effect and expected to fail
      # harmlessly when this workflow didn't just create the namespace
      # (whichever identity did already has superuser rights instead, so
      # nothing needs granting, or the role/grant already exists from a
      # previous run) - failures are reported, not swallowed silently, but
      # never fail the workflow.
      - name: Ensure the database is usable by any identity
        continue-on-error: true
        run: |
          run_sql() {
            local sql="$1"
            local id
            id=$(aws redshift-data execute-statement \
              --workgroup-name pipeline-gcp-to-aws \
              --database dev \
              --sql "$sql" \
              --query 'Id' --output text)
            for i in $(seq 1 30); do
              local status
              status=$(aws redshift-data describe-statement --id "$id" --query 'Status' --output text)
              if [ "$status" = "FINISHED" ]; then
                echo "OK: $sql"
                return 0
              fi
              if [ "$status" = "FAILED" ] || [ "$status" = "ABORTED" ]; then
                echo "Not applied (likely already in place, or this role isn't the bootstrap identity this time): $sql"
                aws redshift-data describe-statement --id "$id" --query 'Error' --output text
                return 0
              fi
              sleep 2
            done
            echo "Timed out: $sql"
          }

          run_sql "GRANT CREATE ON DATABASE dev TO PUBLIC"
          run_sql "CREATE ROLE db_admin"
          run_sql "GRANT CREATE USER TO ROLE db_admin"
          run_sql 'GRANT ROLE db_admin TO "IAM:pipeline-gcp-to-aws-migration"'
