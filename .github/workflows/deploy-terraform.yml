name: deploy-terraform

# Manual trigger only - this project has no server-side app to deploy (the
# pipeline runs locally), so the only thing "deployed" to AWS is the
# Terraform-managed infrastructure itself.
on:
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC -> AWS
  contents: read

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out tfplan

      - name: Terraform apply
        run: terraform apply tfplan

      # Redshift Serverless (no admin password set - see config.py) grants
      # superuser privileges to whichever IAM identity first provisions a
      # fresh namespace. When this workflow just created one (as just
      # happened once), that's this workflow's own role, not the local dev
      # user that actually runs the pipeline - which then has no privilege
      # to CREATE SCHEMA at all. This step is idempotent (safe to run every
      # time) and expected to fail harmlessly when this workflow didn't
      # just create the namespace (whichever identity did already has
      # superuser rights instead, so nothing needs granting) - it reports
      # that outcome without failing the workflow.
      - name: Ensure the database is usable by any identity
        continue-on-error: true
        run: |
          STATEMENT_ID=$(aws redshift-data execute-statement \
            --workgroup-name pipeline-gcp-to-aws \
            --database dev \
            --sql 'GRANT CREATE ON DATABASE dev TO PUBLIC' \
            --query 'Id' --output text)
          for i in $(seq 1 30); do
            STATUS=$(aws redshift-data describe-statement --id "$STATEMENT_ID" --query 'Status' --output text)
            if [ "$STATUS" = "FINISHED" ]; then
              echo "Granted CREATE on database dev to PUBLIC."
              exit 0
            fi
            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "ABORTED" ]; then
              echo "Grant not applied (this role likely wasn't the namespace's bootstrap identity this time, so it's not needed):"
              aws redshift-data describe-statement --id "$STATEMENT_ID" --query 'Error' --output text
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for the grant statement; continuing anyway."
