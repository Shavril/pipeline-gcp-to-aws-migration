name: deploy-terraform

# Manual trigger only - this project has no server-side app to deploy (the
# pipeline runs locally), so the only thing "deployed" to AWS is the
# Terraform-managed infrastructure itself.
on:
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC -> AWS
  contents: read

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      # Temporary diagnostic step - decodes just the sub/aud claims of the
      # OIDC token GitHub issues, to compare directly against the AWS role's
      # trust policy condition instead of guessing. Prints no secrets: the
      # token itself is never echoed, only these specific claim values.
      # Remove once the OIDC assume-role failure is resolved.
      - name: Debug - decode OIDC token claims
        run: |
          IDTOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(echo "$IDTOKEN" | cut -d '.' -f2 | tr '_-' '/+')
          MOD=$(( ${#PAYLOAD} % 4 ))
          if [ $MOD -eq 2 ]; then PAYLOAD="${PAYLOAD}=="; elif [ $MOD -eq 3 ]; then PAYLOAD="${PAYLOAD}="; fi
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, iss, repository, repository_owner, ref, workflow, event_name, environment}'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out tfplan

      - name: Terraform apply
        run: terraform apply tfplan
